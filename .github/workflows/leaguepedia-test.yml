name: Test Leaguepedia
# Vérifie la connexion à Leaguepedia et liste les données disponibles. Lancement manuel uniquement.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python pipeline/leaguepedia.py
        env:
          LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
          LEAGUEPEDIA_PASSWORD: ${{ secrets.LEAGUEPEDIA_PASSWORD }}
