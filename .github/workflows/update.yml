name: Mise à jour hebdomadaire
# Retélécharge les matchs (Oracle's Elixir) et les contrats (base publique de Riot),
# recalcule les notes et republie la page (docs/index.html).
on:
  schedule:
    - cron: '17 5 * * 2'      # chaque mardi à 05:17 UTC, après les matchs du week-end
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Télécharger les matchs
        id: data
        run: |
          set +e
          python pipeline/fetch_data.py
          code=$?
          if [ $code -eq 3 ]; then
            echo "::warning::Téléchargement des matchs refusé (quota Google Drive ?). Mise à jour reportée."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          exit $code
      - name: Télécharger les contrats
        if: steps.data.outputs.skip != 'true'
        run: python pipeline/fetch_contracts.py || echo "::warning::Contrats non mis à jour, on garde le dernier relevé."
      - name: Télécharger les fiches joueurs (Leaguepedia)
        if: steps.data.outputs.skip != 'true'
        run: python pipeline/fetch_leaguepedia.py || echo "::warning::Leaguepedia non mis à jour, on garde le dernier relevé."
        env:
          LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
          LEAGUEPEDIA_PASSWORD: ${{ secrets.LEAGUEPEDIA_PASSWORD }}
      - name: Télécharger les chronologies des nouvelles parties (Leaguepedia)
        if: steps.data.outputs.skip != 'true'
        run: python pipeline/fetch_timelines.py "$(date -u +%Y)" 40 || echo "::warning::Chronologies non mises à jour, les nouvelles parties sont notées sans elles."
        env:
          LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
          LEAGUEPEDIA_PASSWORD: ${{ secrets.LEAGUEPEDIA_PASSWORD }}
      - name: Parties absentes d'Oracle's Elixir (Leaguepedia)
        if: steps.data.outputs.skip != 'true'
        run: python pipeline/fetch_lp_games.py "$(date -u +%Y)" 30 || echo "::warning::Parties Leaguepedia non mises à jour, on garde le dernier relevé."
        env:
          LEAGUEPEDIA_USER: ${{ secrets.LEAGUEPEDIA_USER }}
          LEAGUEPEDIA_PASSWORD: ${{ secrets.LEAGUEPEDIA_PASSWORD }}
      - name: Notes LoL Ratings pour la note mixte (identifiant et points seulement)
        if: steps.data.outputs.skip != 'true'
        run: |
          for y in $(date -u +%Y) $(($(date -u +%Y) - 1)); do
            curl -sfL "https://raw.githubusercontent.com/Oradixx/LoL-ratings/main/results/ratings_$y.csv" -o /tmp/lr.csv \
              && python -c "import pandas as pd; pd.read_csv('/tmp/lr.csv')[['pid','points']].to_csv('pipeline/lr_ratings_$y.csv', index=False)" \
              || echo "::warning::Notes LoL Ratings $y non mises à jour, on garde les dernières."
          done
      - name: Calculer les notes
        if: steps.data.outputs.skip != 'true'
        run: python -W ignore pipeline/build.py data/raw
      - name: Vérifier le résultat
        if: steps.data.outputs.skip != 'true'
        run: python pipeline/check.py
      - name: Assembler la page
        if: steps.data.outputs.skip != 'true'
        run: python build_page.py
      - name: Publier
        if: steps.data.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html pipeline/contracts.json pipeline/lp_players.json pipeline/lp_coverage.json pipeline/lp_timeline_*.csv.gz pipeline/lp_games_*.csv.gz pipeline/lr_ratings_*.csv
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Mise à jour hebdomadaire : données au $(date -u +%F)"
          git push
